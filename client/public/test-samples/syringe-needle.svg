<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.6)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.3)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Tray outline -->
  <rect x="30" y="30" width="340" height="240" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="40" width="320" height="220" rx="8" fill="#0D1527" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Sharps Badge -->
  <rect x="55" y="55" width="110" height="26" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
  <text x="110" y="72" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SHARPS / NEEDLE</text>

  <!-- Syringe Needle (Steel cannula) -->
  <line x1="70" y1="150" x2="150" y2="150" stroke="url(#needleGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="68,149 68,151 60,150" fill="#CBD5E1"/>

  <!-- Needle Hub -->
  <rect x="150" y="142" width="16" height="16" rx="2" fill="#38BDF8"/>

  <!-- Syringe Barrel (Cylinder) -->
  <rect x="166" y="130" width="120" height="40" rx="4" fill="url(#barrelGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  
  <!-- Measurement Tick marks on barrel -->
  <line x1="180" y1="130" x2="180" y2="140" stroke="#0284C7" stroke-width="1.5"/>
  <line x1="195" y1="130" x2="195" y2="136" stroke="#0284C7" stroke-width="1"/>
  <line x1="210" y1="130" x2="210" y2="140" stroke="#0284C7" stroke-width="1.5"/>
  <line x1="225" y1="130" x2="225" y2="136" stroke="#0284C7" stroke-width="1"/>
  <line x1="240" y1="130" x2="240" y2="140" stroke="#0284C7" stroke-width="1.5"/>
  <line x1="255" y1="130" x2="255" y2="136" stroke="#0284C7" stroke-width="1"/>
  <line x1="270" y1="130" x2="270" y2="140" stroke="#0284C7" stroke-width="1.5"/>

  <!-- Fluid inside syringe (Blood-tinged / Medicine) -->
  <rect x="167" y="132" width="70" height="36" fill="#DC2626" fill-opacity="0.35"/>

  <!-- Plunger Stopper (Black rubber) -->
  <rect x="235" y="132" width="10" height="36" rx="2" fill="#1E293B"/>

  <!-- Plunger Rod -->
  <rect x="245" y="145" width="65" height="10" fill="#94A3B8"/>
  <rect x="310" y="135" width="8" height="30" rx="3" fill="#64748B"/>

  <!-- Biohazard warning icon & text -->
  <circle cx="330" cy="70" r="14" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="330" y="74" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">☣</text>
  
  <text x="200" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Sample Item #SHP-001 • Puncture Risk Class II
  </text>
</svg>
