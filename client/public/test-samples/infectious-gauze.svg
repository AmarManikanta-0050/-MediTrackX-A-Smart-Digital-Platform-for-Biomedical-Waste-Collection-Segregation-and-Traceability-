<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="stain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#DC2626" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  
  <!-- Biohazard Bag Background -->
  <rect x="30" y="30" width="340" height="240" rx="12" fill="#451A03" fill-opacity="0.25" stroke="#EAB308" stroke-width="1.5"/>
  
  <!-- Category Badge -->
  <rect x="55" y="55" width="130" height="26" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="120" y="72" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INFECTIOUS WASTE</text>

  <!-- Folded Cotton Gauze Swab -->
  <path d="M 110 130 Q 170 115 250 125 Q 280 170 260 210 Q 180 230 115 200 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Blood stain on gauze -->
  <ellipse cx="185" cy="165" rx="55" ry="38" fill="url(#stain)"/>
  <ellipse cx="225" cy="180" rx="28" ry="18" fill="url(#stain)"/>

  <!-- IV Line Tube looping across -->
  <path d="M 60 220 Q 140 180 210 195 T 340 160" fill="none" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.65" stroke-linecap="round"/>
  <path d="M 60 220 Q 140 180 210 195 T 340 160" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>

  <!-- Luer Lock connector on tube -->
  <rect x="330" y="152" width="14" height="16" rx="3" fill="#E2E8F0" stroke="#64748B"/>

  <text x="200" y="250" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Sample Item #INF-002 • Blood &amp; Body Fluid Soiled Dressing
  </text>
</svg>
